[project]
name = "offerlens-agent"
version = "0.1.0"
description = "Evidence-grounded multi-agent job intelligence and interview preparation platform."
authors = [
    { name = "xzy5220" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-community>=0.4,<1",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langsmith>=0.3,<1",
    "markdownify>=1.1,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "rapidfuzz>=3.10,<4",
    "sse-starlette>=2.2,<4",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
search = [
    "ddgs>=9,<10",
    "tavily-python>=0.7,<1",
]
mcp = ["langchain-mcp-adapters>=0.2,<1"]
postgres = [
    "asyncpg>=0.30,<1",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
]
redis = ["redis>=5,<7"]
upstream-providers = [
    "langchain-anthropic>=1.0,<2",
    "langchain-deepseek>=1.0,<2",
    "langchain-google-genai>=3.0,<5",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
offerlens-api = "offerlens_agent.api.app:run"
offerlens-eval = "offerlens_agent.evaluation.cli:main"
offerlens-mcp = "offerlens_agent.mcp_server:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["offerlens_agent*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP", "S101"]
"src/offerlens_agent/api/app.py" = ["B008"]
"src/offerlens_agent/evaluation/cli.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["offerlens_agent"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
