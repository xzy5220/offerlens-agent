name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"
      - name: Lint
        run: ruff check src/offerlens_agent tests/unit tests/integration
      - name: Type check
        run: mypy src/offerlens_agent
      - name: Test
        run: pytest --cov=offerlens_agent --cov-report=term-missing
      - name: Offline Agent evaluation
        run: offerlens-eval --dataset data/evals/career_cases.jsonl

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
